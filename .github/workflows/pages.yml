name: Deploy price list to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v5
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Build frontend for the Pages address
        run: npm run build -- --base "${{ steps.pages.outputs.base_path }}/"
      - name: Upload compiled website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy compiled website
        id: deployment
        uses: actions/deploy-pages@v4
